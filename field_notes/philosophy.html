<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering Philosophy & Wisdom Studio | Jason Allred</title>
    <link rel="stylesheet" href="style.css?v=826dbad3">
    <style>
        .philosophy-card {
            background: #14171c;
            border: 1px solid #232832;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }
        .philosophy-card:hover {
            border-color: #3d4659;
        }
        .origin-quote {
            border-left: 3px solid #3b82f6;
            padding: 12px 16px;
            margin: 16px 0;
            background: #1a202c;
            font-style: italic;
            color: #e2e8f0;
            font-size: 1.05em;
            line-height: 1.6;
        }
        .origin-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #60a5fa;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .synthesis-block {
            margin-top: 16px;
            color: #cbd5e1;
            line-height: 1.6;
        }
        .synthesis-label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #10b981;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .anchor-badge {
            display: inline-block;
            background: #1e293b;
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8em;
            margin-right: 6px;
            margin-top: 6px;
            border: 1px solid #334155;
        }
        .tag-badge {
            display: inline-block;
            background: #0f172a;
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-right: 4px;
            border: 1px solid #0369a1;
        }
        .workbench-toggle-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2430;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            border: 1px solid #2d3748;
        }
        .workbench-panel {
            display: none;
            background: #0f131a;
            border: 1px dashed #4b5563;
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
        }
        .edit-active .workbench-panel {
            display: block;
        }
        .btn-action {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-action:hover {
            background: #1d4ed8;
        }
        .editable-origin {
            width: 100%;
            background: #090d13;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95em;
            margin-top: 6px;
            min-height: 80px;
        }
    </style>
</head>
<body>
    <button id="menu-toggle">☰ MENU</button>

    <nav id="sidebar">
        <mission-control></mission-control>
        <input type="text" id="nav-filter" placeholder="Filter philosophy..." aria-label="Filter navigation">

        <div id="searchable-content">
            <h2>Themes</h2>
            <ul>
                <li><a href="#memory-jitc">Memory & JITC</a></li>
                <li><a href="#stability-feedback">Stability & Feedback</a></li>
                <li><a href="#human-ai">Human-AI Interface</a></li>
                <li><a href="#engineering-rigor">Engineering Rigor</a></li>
                <li><a href="#language-invention">Language & Invention</a></li>
                <li><a href="#engineering-vectors">The Vectors of Engineering</a></li>
            </ul>

            <h2>Wisdom Cards</h2>
            <ul id="card-nav-list">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </nav>

    <main id="main-container">
        <div class="workbench-toggle-bar">
            <div>
                <strong>🧠 Philosophy Studio</strong> &mdash; <span id="status-mode">Solidified Publication View</span>
            </div>
            <div>
                <button class="btn-action" id="toggle-edit-btn">Toggle Workbench Mode</button>
            </div>
        </div>

        <section id="philosophy-stream">
            <!-- Rendered cards -->
        </section>
    </main>

    <script>
        let isEditMode = window.location.search.includes('edit=1');
        let wisdomCards = [];

        async function loadCards() {
            try {
                const res = await fetch('data/wisdom_data.json');
                wisdomCards = await res.json();
                render();
            } catch (err) {
                console.error("Failed to load wisdom cards:", err);
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const url = new URL(window.location);
            if (isEditMode) {
                url.searchParams.set('edit', '1');
            } else {
                url.searchParams.delete('edit');
            }
            window.history.pushState({}, '', url);
            render();
        }

        function render() {
            const container = document.getElementById('philosophy-stream');
            const navList = document.getElementById('card-nav-list');
            const statusMode = document.getElementById('status-mode');
            const body = document.body;

            if (isEditMode) {
                body.classList.add('edit-active');
                statusMode.textContent = "Interactive Workbench Mode (Decoupled Origin & Synthesis)";
                statusMode.style.color = "#60a5fa";
            } else {
                body.classList.remove('edit-active');
                statusMode.textContent = "Solidified Publication View";
                statusMode.style.color = "#94a3b8";
            }

            container.innerHTML = '';
            navList.innerHTML = '';

            wisdomCards.forEach((card, idx) => {
                // Add to sidebar
                const li = document.createElement('li');
                li.innerHTML = `<a href="#${card.id}">[${card.id}] ${card.synthesis.title}</a>`;
                navList.appendChild(li);

                // Build Card
                const article = document.createElement('article');
                article.className = 'philosophy-card';
                article.id = card.id;

                const tagsHtml = (card.metadata.tags || []).map(t => `<span class="tag-badge">#${t}</span>`).join(' ');
                const anchorsHtml = (card.synthesis.lab_anchors || []).map(a => `<span class="anchor-badge">${a}</span>`).join(' ');

                article.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span style="font-family:monospace; color:#60a5fa; font-size:0.85em;">${card.id} &bull; ${card.theme}</span>
                        <div>${tagsHtml}</div>
                    </div>
                    
                    <h3 style="margin-top:8px; margin-bottom:12px; font-size:1.4em;">${card.synthesis.title}</h3>
                    
                    <div class="origin-quote">
                        <div class="origin-label">
                            <span>👤 Human Origin (${card.origin.author})</span>
                            <span>${card.origin.immutable ? '🔒 IMMUTABLE' : ''}</span>
                        </div>
                        "${card.origin.text}"
                    </div>

                    <div class="synthesis-block">
                        <div class="synthesis-label">🤖 Grounded Synthesis & Connective Tissue</div>
                        <p>${card.synthesis.narrative_context}</p>
                    </div>

                    <div style="margin-top:14px;">
                        ${anchorsHtml}
                    </div>

                    <div class="workbench-panel">
                        <div style="font-weight:600; color:#fbbf24; margin-bottom:8px; font-size:0.85em;">🎛️ Human Origin Editor (Local Stash Only)</div>
                        <textarea class="editable-origin" data-id="${card.id}">${card.origin.text}</textarea>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                            <span style="font-size:0.75em; color:#94a3b8;">Source: ${card.origin.source}</span>
                            <button class="btn-action" style="background:#059669; font-size:0.8em;" onclick="saveCardLocal('${card.id}')">Update Origin In-Memory</button>
                        </div>
                    </div>
                `;

                container.appendChild(article);
            });
        }

        window.saveCardLocal = function(cardId) {
            const textarea = document.querySelector(`textarea[data-id="${cardId}"]`);
            if (!textarea) return;
            const card = wisdomCards.find(c => c.id === cardId);
            if (card) {
                card.origin.text = textarea.value;
                alert(`Updated origin text for ${cardId} in current browser session.`);
                render();
            }
        };

        document.getElementById('toggle-edit-btn').addEventListener('click', toggleEditMode);
        document.addEventListener('DOMContentLoaded', loadCards);
    </script>
</body>
</html>
